# =============================================================================
# Nexus Production Docker Compose Configuration
# =============================================================================
# This file defines a production-grade multi-service deployment for Nexus AI/ML
# platform including caching, metadata storage, monitoring, and SSL termination.
# =============================================================================

version: "3.8"

# =============================================================================
# Networks
# =============================================================================
networks:
  nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  monitoring:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  nexus-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  traefik-certs:
    driver: local
  model-cache:
    driver: local
  alertmanager-data:
    driver: local

# =============================================================================
# Services
# =============================================================================
services:
  # ===========================================================================
  # Reverse Proxy / SSL Termination (Traefik)
  # ===========================================================================
  traefik:
    image: traefik:v3.0
    container_name: nexus-traefik
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@nexus-platform.io"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--log.level=WARN"
      - "--accesslog=true"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      - "--ping=true"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Dashboard (restrict in production)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    networks:
      - nexus-network
      - monitoring
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`traefik.nexus-platform.io`)"
      - "traefik.http.routers.api.service=api@internal"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.middlewares=auth@docker"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ===========================================================================
  # Nexus API Server
  # ===========================================================================
  nexus-api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: production
    container_name: nexus-api
    environment:
      - NEXUS_LOG_LEVEL=info
      - NEXUS_LOG_FORMAT=json
      - NEXUS_API_HOST=0.0.0.0
      - NEXUS_API_PORT=8000
      - NEXUS_API_WORKERS=4
      - NEXUS_DATABASE_HOST=postgres
      - NEXUS_DATABASE_PORT=5432
      - NEXUS_DATABASE_NAME=nexus
      - NEXUS_DATABASE_USER=nexus
      - NEXUS_DATABASE_PASSWORD=${DB_PASSWORD:-nexus_secure_password}
      - NEXUS_REDIS_HOST=redis
      - NEXUS_REDIS_PORT=6379
      - NEXUS_REDIS_PASSWORD=${REDIS_PASSWORD:-nexus_secure_password}
      - NEXUS_MINIO_ENDPOINT=http://minio:9000
      - NEXUS_MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - NEXUS_MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - NEXUS_MODEL_CACHE_DIR=/data/models
      - NEXUS_STORAGE_TYPE=s3
      - NEXUS_STORAGE_BUCKET=nexus-data
      - NEXUS_FEATURE_MULTIMODAL=true
      - NEXUS_FEATURE_TRAINING=true
      - NEXUS_FEATURE_STREAMING=true
      - NEXUS_FEATURE_CACHING=true
      - NEXUS_FEATURE_METRICS=true
      - CUDA_VISIBLE_DEVICES=0
      - TRANSFORMERS_CACHE=/data/models
      - HF_HOME=/data/models
      - OMP_NUM_THREADS=8
    volumes:
      - nexus-data:/data
      - model-cache:/data/models
    networks:
      - nexus-network
      - monitoring
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nexus.rule=Host(`api.nexus-platform.io`)"
      - "traefik.http.routers.nexus.entrypoints=websecure"
      - "traefik.http.routers.nexus.tls.certresolver=letsencrypt"
      - "traefik.http.services.nexus.loadbalancer.server.port=8000"
      - "traefik.http.services.nexus.loadbalancer.healthcheck.path=/health/ready"
      - "traefik.http.services.nexus.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.middlewares.nexus-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.nexus-ratelimit.ratelimit.burst=200"
      - "traefik.http.routers.nexus.middlewares=nexus-ratelimit"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '8.0'
          memory: 32G
        reservations:
          cpus: '4.0'
          memory: 16G
    runtime: nvidia # Requires nvidia-docker2

  # ===========================================================================
  # Nexus Worker (Background Processing)
  # ===========================================================================
  nexus-worker:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: production
    container_name: nexus-worker
    command: [ "python", "-m", "nexus.worker" ]
    environment:
      - NEXUS_LOG_LEVEL=info
      - NEXUS_LOG_FORMAT=json
      - NEXUS_DATABASE_HOST=postgres
      - NEXUS_DATABASE_PORT=5432
      - NEXUS_DATABASE_NAME=nexus
      - NEXUS_DATABASE_USER=nexus
      - NEXUS_DATABASE_PASSWORD=${DB_PASSWORD:-nexus_secure_password}
      - NEXUS_REDIS_HOST=redis
      - NEXUS_REDIS_PORT=6379
      - NEXUS_REDIS_PASSWORD=${REDIS_PASSWORD:-nexus_secure_password}
      - NEXUS_MINIO_ENDPOINT=http://minio:9000
      - NEXUS_MODEL_CACHE_DIR=/data/models
      - NEXUS_WORKER_CONCURRENCY=4
      - CUDA_VISIBLE_DEVICES=0
      - TRANSFORMERS_CACHE=/data/models
      - HF_HOME=/data/models
    volumes:
      - nexus-data:/data
      - model-cache:/data/models
    networks:
      - nexus-network
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '4.0'
          memory: 16G
        reservations:
          cpus: '2.0'
          memory: 8G
    runtime: nvidia

  # ===========================================================================
  # PostgreSQL (Metadata Storage)
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    environment:
      - POSTGRES_USER=nexus
      - POSTGRES_PASSWORD=${DB_PASSWORD:-nexus_secure_password}
      - POSTGRES_DB=nexus
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=en_US.UTF-8
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - nexus-network
    ports:
      - "127.0.0.1:5432:5432" # Local only for security
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U nexus -d nexus" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - default_statistics_target=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - work_mem=5242kB
      - -c
      - min_wal_size=1GB
      - -c
      - max_wal_size=4GB

  # ===========================================================================
  # Redis (Caching & Message Queue)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-nexus_secure_password} --appendonly yes --appendfsync everysec --maxmemory 2gb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10 --save 60 10000
    volumes:
      - redis-data:/data
    networks:
      - nexus-network
    ports:
      - "127.0.0.1:6379:6379" # Local only for security
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-nexus_secure_password}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # ===========================================================================
  # Redis Exporter (for Prometheus)
  # ===========================================================================
  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    container_name: nexus-redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-nexus_secure_password}
    networks:
      - nexus-network
      - monitoring
    depends_on:
      - redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ===========================================================================
  # MinIO (Object Storage)
  # ===========================================================================
  minio:
    image: minio/minio:RELEASE.2024-01-13T07-53-03Z
    container_name: nexus-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BROWSER=on
    volumes:
      - minio-data:/data
    networks:
      - nexus-network
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`storage.nexus-platform.io`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.routers.minio.tls.certresolver=letsencrypt"
      - "traefik.http.services.minio.loadbalancer.server.port=9001"

  # ===========================================================================
  # Prometheus (Metrics Collection)
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: nexus-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=50GB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - prometheus-data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
    networks:
      - monitoring
    ports:
      - "127.0.0.1:9090:9090" # Local only
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.nexus-platform.io`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.routers.prometheus.middlewares=auth@docker"

  # ===========================================================================
  # Grafana (Visualization)
  # ===========================================================================
  grafana:
    image: grafana/grafana:10.3.1
    container_name: nexus-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.nexus-platform.io
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SECURITY_ANGULAR_SUPPORT_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana-datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - monitoring
    ports:
      - "127.0.0.1:3000:3000" # Local only
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep ok" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.nexus-platform.io`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"

  # ===========================================================================
  # Node Exporter (Host Metrics)
  # ===========================================================================
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: nexus-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ===========================================================================
  # cAdvisor (Container Metrics)
  # ===========================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: nexus-cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ===========================================================================
  # Alertmanager (Alert Routing)
  # ===========================================================================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: nexus-alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=https://alerts.nexus-platform.io'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/config.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - monitoring
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alertmanager.rule=Host(`alerts.nexus-platform.io`)"
      - "traefik.http.routers.alertmanager.entrypoints=websecure"
      - "traefik.http.routers.alertmanager.tls.certresolver=letsencrypt"
