{{- if and .Values.secrets.enabled .Values.secrets.data }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{- include "nexus.fullname" . | quote }}
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
type: Opaque
data:
{{- range $key, $value := .Values.secrets.data }}
  {{ $key | quote }}: {{ $value | b64enc | quote }}
{{- end }}
{{- end }}
{{- if .Values.secrets.externalSecrets }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{- include "nexus.fullname" . | quote }}-external
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secrets.externalSecrets.secretStoreName | default "aws-secrets-manager" | quote }}
    kind: {{ .Values.secrets.externalSecrets.secretStoreKind | default "ClusterSecretStore" | quote }}
  target:
    name: {{- include "nexus.fullname" . | quote }}
    creationPolicy: Owner
  data:
{{- range $key, $config := .Values.secrets.externalSecrets.secrets }}
  - secretKey: {{ $key | quote }}
    remoteRef:
      key: {{ $config.remoteKey | quote }}
      property: {{ $config.property | default "value" | quote }}
{{- end }}
{{- end }}