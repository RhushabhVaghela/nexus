# =============================================================================
# Prometheus Alert Rules for Nexus
# =============================================================================

groups:
  # ==========================================================================
  # Nexus Application Alerts
  # ==========================================================================
  - name: nexus.application
    interval: 15s
    rules:
      - alert: NexusHighErrorRate
        expr: |
          (
            sum(rate(nexus_requests_total{status=~"5.."}[5m])) by (instance)
            /
            sum(rate(nexus_requests_total[5m])) by (instance)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          service: nexus
          team: platform
        annotations:
          summary: "Nexus high error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.instance }}"
          runbook_url: "https://wiki.nexus-platform.io/runbooks/high-error-rate"

      - alert: NexusHighLatency
        expr: |
          histogram_quantile(0.95, 
            sum(rate(nexus_request_duration_seconds_bucket[5m])) by (le, instance)
          ) > 5
        for: 5m
        labels:
          severity: warning
          service: nexus
          team: platform
        annotations:
          summary: "Nexus high latency detected"
          description: "95th percentile latency is {{ $value }}s for {{ $labels.instance }}"
          runbook_url: "https://wiki.nexus-platform.io/runbooks/high-latency"

      - alert: NexusPodCrashLooping
        expr: |
          rate(kube_pod_container_status_restarts_total{container="nexus"}[15m]) > 0
        for: 5m
        labels:
          severity: critical
          service: nexus
          team: platform
        annotations:
          summary: "Nexus pod is crash looping"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is restarting frequently"
          runbook_url: "https://wiki.nexus-platform.io/runbooks/crash-loop"

      - alert: NexusPodNotReady
        expr: |
          kube_pod_status_ready{pod=~"nexus-.*", condition="true"} == 0
        for: 5m
        labels:
          severity: critical
          service: nexus
          team: platform
        annotations:
          summary: "Nexus pod not ready"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is not ready"

      - alert: NexusDown
        expr: |
          up{job="nexus-api"} == 0
        for: 2m
        labels:
          severity: critical
          service: nexus
          team: platform
        annotations:
          summary: "Nexus API is down"
          description: "Nexus API instance {{ $labels.instance }} has been down for more than 2 minutes"

      - alert: NexusQueueHigh
        expr: |
          nexus_queue_size / nexus_queue_max_size > 0.8
        for: 5m
        labels:
          severity: warning
          service: nexus
          team: platform
        annotations:
          summary: "Nexus queue near capacity"
          description: "Queue is at {{ $value | humanizePercentage }} capacity"

  # ==========================================================================
  # Resource Alerts
  # ==========================================================================
  - name: nexus.resources
    interval: 30s
    rules:
      - alert: NexusHighCPUUsage
        expr: |
          100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          service: nexus
          team: platform
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 80% for {{ $labels.instance }}"

      - alert: NexusHighMemoryUsage
        expr: |
          (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 10m
        labels:
          severity: warning
          service: nexus
          team: platform
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }}% for {{ $labels.instance }}"

      - alert: NexusGPUMemoryHigh
        expr: |
          nexus_gpu_memory_used_bytes / nexus_gpu_memory_total_bytes > 0.9
        for: 5m
        labels:
          severity: critical
          service: nexus
          team: platform
        annotations:
          summary: "GPU memory nearly exhausted"
          description: "GPU memory usage is {{ $value | humanizePercentage }}"

      - alert: NexusDiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/data"} / node_filesystem_size_bytes{mountpoint="/data"}) < 0.1
        for: 5m
        labels:
          severity: critical
          service: nexus
          team: platform
        annotations:
          summary: "Disk space critically low"
          description: "Less than 10% disk space remaining on /data"

  # ==========================================================================
  # Database Alerts
  # ==========================================================================
  - name: nexus.database
    interval: 30s
    rules:
      - alert: PostgresDown
        expr: |
          pg_up == 0
        for: 2m
        labels:
          severity: critical
          service: database
          team: platform
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL instance {{ $labels.instance }} is not responding"

      - alert: PostgresHighConnections
        expr: |
          pg_stat_activity_count / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
          service: database
          team: platform
        annotations:
          summary: "PostgreSQL high connection count"
          description: "PostgreSQL is using {{ $value | humanizePercentage }} of max connections"

      - alert: PostgresSlowQueries
        expr: |
          avg(pg_stat_statements_mean_time) by (datname) > 1000
        for: 5m
        labels:
          severity: warning
          service: database
          team: platform
        annotations:
          summary: "PostgreSQL slow queries detected"
          description: "Average query time is {{ $value }}ms in database {{ $labels.datname }}"

  # ==========================================================================
  # Cache Alerts
  # ==========================================================================
  - name: nexus.cache
    interval: 30s
    rules:
      - alert: RedisDown
        expr: |
          redis_up == 0
        for: 2m
        labels:
          severity: critical
          service: cache
          team: platform
        annotations:
          summary: "Redis is down"
          description: "Redis instance {{ $labels.instance }} is not responding"

      - alert: RedisHighMemoryUsage
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          service: cache
          team: platform
        annotations:
          summary: "Redis memory usage high"
          description: "Redis is using {{ $value | humanizePercentage }} of available memory"

      - alert: RedisHighConnections
        expr: |
          redis_connected_clients / redis_config_maxclients > 0.8
        for: 5m
        labels:
          severity: warning
          service: cache
          team: platform
        annotations:
          summary: "Redis connection count high"
          description: "Redis has {{ $value | humanizePercentage }} of max connections"

  # ==========================================================================
  # Storage Alerts
  # ==========================================================================
  - name: nexus.storage
    interval: 60s
    rules:
      - alert: MinioDown
        expr: |
          minio_cluster_nodes_offline_total > 0
        for: 2m
        labels:
          severity: critical
          service: storage
          team: platform
        annotations:
          summary: "MinIO nodes offline"
          description: "{{ $value }} MinIO node(s) are offline"

      - alert: MinioDiskHighUsage
        expr: |
          minio_cluster_disk_used_free_bytes / minio_cluster_disk_total_bytes < 0.1
        for: 10m
        labels:
          severity: critical
          service: storage
          team: platform
        annotations:
          summary: "MinIO disk space critically low"
          description: "Less than 10% free disk space on MinIO cluster"

  # ==========================================================================
  # Infrastructure Alerts
  # ==========================================================================
  - name: nexus.infrastructure
    interval: 30s
    rules:
      - alert: NodeDown
        expr: |
          up{job="node-exporter"} == 0
        for: 5m
        labels:
          severity: critical
          service: infrastructure
          team: platform
        annotations:
          summary: "Node exporter down"
          description: "Node {{ $labels.instance }} is not reporting metrics"

      - alert: ContainerHighRestartRate
        expr: |
          rate(kube_pod_container_status_restarts_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          service: infrastructure
          team: platform
        annotations:
          summary: "Container restarting frequently"
          description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is restarting"

      - alert: KubernetesNodeNotReady
        expr: |
          kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels:
          severity: critical
          service: infrastructure
          team: platform
        annotations:
          summary: "Kubernetes node not ready"
          description: "Node {{ $labels.node }} is not ready"
