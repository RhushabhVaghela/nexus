apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: GET
      prometheusVersion: 2.45.0
      prometheusType: Prometheus

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      timeout: 30s

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3100
    editable: false
    jsonData:
      tracesToLogs:
        datasourceUid: Loki
        tags: []
        mappedTags: []
        filterByTraceID: false

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    editable: false
    jsonData:
      sslmode: require
      database: nexus
      user: nexus
      # Password should be managed via Grafana secrets
    secureJsonData:
      password: ${POSTGRES_PASSWORD}

  - name: Alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus