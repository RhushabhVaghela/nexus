name: nexus
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python>=3.9,<3.13
  
  # Core PyTorch
  - pytorch>=2.1.0
  - cuda-toolkit>=12.4
  - cudnn>=8.9
  - nccl>=2.19
  
  # Core ML dependencies
  - numpy>=1.24.0,<2.0
  - scipy>=1.11.0
  - pandas>=2.0.0
  - scikit-learn>=1.3.0
  
  # Deep Learning
  - transformers>=4.40.0
  - datasets>=2.14.0
  - accelerate>=0.27.0
  - peft>=0.8.0
  - bitsandbytes>=0.41.0
  
  # Quantization
  - auto-gptq>=0.5.0
  - awq>=0.1.0
  
  # Attention & Efficiency
  - flash-attn>=2.0.0
  - xformers>=0.0.23
  
  # Monitoring & Logging
  - wandb>=0.16.0
  - tensorboard>=2.14.0
  - prometheus-client>=0.19.0
  
  # API & Web
  - fastapi>=0.110.0
  - uvicorn>=0.27.0
  - pydantic>=2.5.0
  - pydantic-settings>=2.1.0
  - python-multipart>=0.0.6
  - starlette>=0.36.0
  
  # HTTP & Async
  - httpx>=0.26.0
  - aiohttp>=3.9.0
  - aiosqlite>=0.19.0
  
  # Database
  - sqlalchemy>=2.0.0
  - alembic>=1.13.0
  - asyncpg>=0.29.0
  
  # Utilities
  - pyyaml>=6.0.0
  - tqdm>=4.66.0
  - click>=8.1.0
  - rich>=13.7.0
  - typer>=0.9.0
  - coloredlogs>=15.0.0
  
  # Security
  - python-jose>=3.3.0
  - passlib>=1.7.4
  - bcrypt>=4.1.0
  
  # Image/Video Processing
  - pillow>=10.0.0
  - opencv>=4.9.0
  - decord>=0.6.0
  
  # Audio Processing
  - librosa>=0.10.0
  - soundfile>=1.3.0
  
  # Code Execution
  - astunparse>=1.6.3
  - execnet>=2.0.0
  
  # Development tools
  - ipython>=8.0.0
  - ipdb>=0.13.0
  
  # Packaging
  - pip>=24.0

variables:
  CUDA_LAUNCH_BLOCKING: "0"
  CUDNN_LOGGING_DEDUCTION: "0"
