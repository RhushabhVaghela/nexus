[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-distill"
version = "6.1.0"
description = "Universal knowledge distillation platform — distill multi-modal teacher models into efficient students via Sequential Layer Ingestion (SLI)"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
authors = [
    {name = "Rhushabh Vaghela", email = "rhushabhvaghela@gmail.com"}
]
keywords = [
    "knowledge-distillation",
    "model-compression",
    "deep-learning",
    "llm",
    "multimodal",
    "sequential-layer-ingestion",
    "teacher-student",
    "model-distillation",
    "neural-network-compression",
    "pytorch",
    "transformers",
    "mixture-of-experts",
    "quantization",
    "ai",
    "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    # ML / Deep Learning (core)
    "torch>=2.1.0",
    "transformers>=4.39.0",
    "accelerate>=0.27.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "bitsandbytes>=0.43.0",
    "datasets>=2.18.0",
    # Data / Science
    "numpy>=1.24.0,<2.0",
    "pandas",
    "scikit-learn",
    "scipy",
    "faiss-cpu",
    # API / Web
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    # CLI
    "rich>=13.0.0",
    # Config / Serialization
    "pyyaml>=6.0",
    "sentencepiece",
    "protobuf",
    # Media (lightweight — heavy backends in optional groups)
    "pillow",
    # Utilities
    "tqdm",
    "psutil",
]

[project.optional-dependencies]
audio = [
    "torchaudio",
    "audiocraft>=1.3.0",
    "TTS>=0.22.0",
    "soundfile>=0.12.1",
    "pydub>=0.25.1",
]
video = [
    "torchvision",
    "diffusers>=0.26.0",
    "av>=11.0.0",
]
monitoring = [
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-exporter-jaeger>=1.21.0",
    "redis>=5.0.0",
    "pynvml>=11.5.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-timeout>=2.2.0",
    "pytest-xdist>=3.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "ipykernel",
    "jupyter",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=1.0.0",
]
nvfp4 = [
    "transformer-engine[pytorch]",
]
gpu-compression = [
    "cuda-zstd>=1.0.0",
]
# Convenience: install everything
all = [
    "nexus-distill[audio,video,monitoring,dev,docs]",
]

[project.scripts]
nexus = "nexus.cli.nexus_cli:main"
nexus-completion = "nexus.cli.completion:main"

[project.urls]
Homepage = "https://github.com/RhushabhVaghela/manus-model"
Documentation = "https://github.com/RhushabhVaghela/manus-model#readme"
Repository = "https://github.com/RhushabhVaghela/manus-model"
Issues = "https://github.com/RhushabhVaghela/manus-model/issues"
Changelog = "https://github.com/RhushabhVaghela/manus-model/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["nexus*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
nexus = ["config/*.yaml", "config/*.json"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "gpu: marks tests that require GPU",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/nexus"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
